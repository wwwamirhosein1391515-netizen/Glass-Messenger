<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Messenger | پیام‌رسان گلس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap');
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* Liquid Animations */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        /* Glass Backgrounds */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px border rgba(255, 255, 255, 0.2);
        }

        /* Telegram Style Chat Background */
        .chat-bg {
            background-color: #0f0f0f;
            background-image: url('https://web.telegram.org/a/chat-bg-pattern-dark.ad38368a9e8146d530.png');
            background-repeat: repeat;
            background-blend-mode: overlay;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            Send, Paperclip, MoreVertical, Search, Menu, 
            ArrowLeft, Phone, Check, CheckCheck, Smile, 
            Mic, Image, X, Circle
        } = lucide;

        // --- Mock Data ---
        const INITIAL_CONTACTS = [
            { id: 1, name: 'پشتیبانی گلس', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=Glass', status: 'online', messages: [{ id: 1, text: 'به گلس خوش آمدید! چطور می‌تونم کمکتون کنم؟', time: '10:00', sent: false, read: true }] },
            { id: 2, name: 'سارا احمدی', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Sara', status: 'offline', lastSeen: '۲ ساعت پیش', messages: [{ id: 1, text: 'سلام، پروژه‌ی جدید رو دیدی؟', time: '09:15', sent: false, read: true }] },
            { id: 3, name: 'علی مدیر', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Ali', status: 'online', messages: [{ id: 1, text: 'فردا جلسه داریم.', time: '11:45', sent: true, read: true }] }
        ];

        // --- Sub-Components ---
        const AuthScreen = ({ onLogin }) => {
            const [step, setStep] = useState(1);
            const [phone, setPhone] = useState('');
            const [code, setCode] = useState('');

            return (
                <div className="h-screen w-full flex items-center justify-center bg-[#24A1DE] relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-72 h-72 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
                    <div className="absolute bottom-0 right-0 w-72 h-72 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>
                    
                    <div className="glass-panel w-full max-w-sm p-8 rounded-3xl shadow-2xl z-10 text-white text-center">
                        <div className="w-20 h-20 bg-white/20 rounded-full mx-auto mb-6 flex items-center justify-center">
                            <i data-lucide="send" className="w-10 h-10"></i>
                        </div>
                        <h1 className="text-2xl font-bold mb-2">Glass Messenger</h1>
                        
                        {step === 1 ? (
                            <div className="space-y-4">
                                <p className="text-white/70 text-sm">لطفاً شماره موبایل خود را وارد کنید</p>
                                <input 
                                    className="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-center text-lg outline-none focus:ring-2 ring-white/30"
                                    placeholder="09123456789"
                                    value={phone}
                                    onChange={e => setPhone(e.target.value)}
                                />
                                <button onClick={() => setStep(2)} className="w-full bg-white text-blue-600 font-bold py-3 rounded-xl hover:bg-opacity-90 transition-all">ادامه</button>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <p className="text-white/70 text-sm">کد ارسال شده به {phone} را وارد کنید</p>
                                <input 
                                    className="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-center text-xl tracking-widest outline-none focus:ring-2 ring-white/30"
                                    placeholder="-----"
                                    value={code}
                                    onChange={e => setCode(e.target.value)}
                                />
                                <button onClick={() => onLogin(phone)} className="w-full bg-white text-blue-600 font-bold py-3 rounded-xl hover:bg-opacity-90 transition-all">ورود</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const MainApp = () => {
            const [activeChat, setActiveChat] = useState(null);
            const [contacts, setContacts] = useState(INITIAL_CONTACTS);
            const [inputText, setInputText] = useState('');

            const sendMessage = () => {
                if (!inputText.trim()) return;
                const updated = contacts.map(c => {
                    if (c.id === activeChat.id) {
                        return { ...c, messages: [...c.messages, { id: Date.now(), text: inputText, time: '12:00', sent: true, read: false }] };
                    }
                    return c;
                });
                setContacts(updated);
                setActiveChat(updated.find(c => c.id === activeChat.id));
                setInputText('');
            };

            return (
                <div className="h-screen flex bg-[#17212b] text-white">
                    {/* Sidebar */}
                    <div className={`w-full md:w-[400px] border-l border-black/20 flex flex-col bg-[#17212b] ${activeChat ? 'hidden md:flex' : 'flex'}`}>
                        <div className="p-4 flex items-center gap-4">
                            <Menu className="text-gray-400" />
                            <div className="flex-1 bg-[#242f3d] rounded-full px-4 py-2 flex items-center gap-2">
                                <Search size={18} className="text-gray-500" />
                                <input className="bg-transparent border-none outline-none text-sm w-full" placeholder="جستجو" />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scrollbar">
                            {contacts.map(c => (
                                <div key={c.id} onClick={() => setActiveChat(c)} className="flex items-center gap-4 p-3 hover:bg-[#202b36] cursor-pointer transition-colors">
                                    <img src={c.avatar} className="w-14 h-14 rounded-full" />
                                    <div className="flex-1 border-b border-white/5 pb-3">
                                        <div className="flex justify-between">
                                            <span className="font-bold">{c.name}</span>
                                            <span className="text-xs text-gray-500">{c.messages[c.messages.length-1].time}</span>
                                        </div>
                                        <p className="text-sm text-gray-400 truncate">{c.messages[c.messages.length-1].text}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Chat Area */}
                    <div className={`flex-1 flex flex-col chat-bg relative ${!activeChat ? 'hidden md:flex items-center justify-center' : 'flex'}`}>
                        {activeChat ? (
                            <>
                                {/* Header */}
                                <div className="glass-panel h-16 flex items-center justify-between px-4 z-20">
                                    <div className="flex items-center gap-4">
                                        <ArrowLeft className="md:hidden" onClick={() => setActiveChat(null)} />
                                        <img src={activeChat.avatar} className="w-10 h-10 rounded-full" />
                                        <div>
                                            <div className="font-bold">{activeChat.name}</div>
                                            <div className="text-xs text-blue-400">{activeChat.status}</div>
                                        </div>
                                    </div>
                                    <MoreVertical />
                                </div>
                                
                                {/* Messages */}
                                <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar z-10">
                                    {activeChat.messages.map(m => (
                                        <div key={m.id} className={`flex ${m.sent ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[70%] p-3 rounded-2xl relative shadow-md ${m.sent ? 'bg-[#2b5278] rounded-br-none' : 'bg-[#182533] rounded-bl-none'}`}>
                                                <p>{m.text}</p>
                                                <div className="text-[10px] text-white/50 text-left mt-1 flex items-center gap-1">
                                                    {m.time}
                                                    {m.sent && (m.read ? <CheckCheck size={12}/> : <Check size={12}/>)}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* Input */}
                                <div className="p-4 z-20">
                                    <div className="max-w-4xl mx-auto flex items-end gap-2">
                                        <div className="flex-1 glass-panel rounded-2xl p-2 flex items-end gap-2">
                                            <Smile className="text-gray-400 mb-2 cursor-pointer" />
                                            <textarea 
                                                value={inputText}
                                                onChange={e => setInputText(e.target.value)}
                                                className="flex-1 bg-transparent border-none outline-none py-2 resize-none max-h-32" 
                                                placeholder="پیام..."
                                                rows="1"
                                            ></textarea>
                                            <Paperclip className="text-gray-400 mb-2 cursor-pointer" />
                                        </div>
                                        <button onClick={sendMessage} className="w-12 h-12 bg-[#24A1DE] rounded-full flex items-center justify-center hover:scale-110 transition-transform">
                                            {inputText ? <Send size={20} /> : <Mic size={20} />}
                                        </button>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="bg-black/20 px-4 py-1 rounded-full text-sm">یکی از گفتگوها را برای شروع پیام انتخاب کنید</div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            
            useEffect(() => {
                lucide.createIcons();
            }, [isLoggedIn]);

            return isLoggedIn ? <MainApp /> : <AuthScreen onLogin={() => setIsLoggedIn(true)} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
